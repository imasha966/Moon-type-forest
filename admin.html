<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Forest Type Admin - Timer FIXED</title><style>body{background:#0a1222;color:white;font-family:sans-serif;padding:16px}.card{background:rgba(255,255,255,.06);border-radius:16px;padding:20px;margin:14px 0;max-width:600px}input,button{padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:white}button{background:linear-gradient(135deg,#ffe9a8,#ffb86a);color:#12372a;font-weight:700}input[type=number]{width:120px;border:2px solid #7dd3c8;font-size:20px;text-align:center;font-weight:700;background:rgba(255,255,255,.08)} .time-msg{margin-top:10px;padding:10px;background:rgba(125,211,200,.15);border-radius:10px}</style></head><body>
<h1>🌙 Forest Type Admin - Timer FIXED</h1>
<p style="opacity:.7">Matara Technical College • Timer now editable!</p>
<div class="card"><h3>Room Setup</h3><input id="roomInput" value="FOREST123" style="flex:1"/><button id="createRoomBtn">Create Room</button><p id="roomStatus" style="margin-top:10px"></p></div>
<div class="card"><h3>⏱️ Duration - FIXED Editable</h3><p style="font-size:12px;opacity:.7;margin:6px 0">BUG FIXED: You can now type, delete, backspace! 1-30 min</p><div style="display:flex;gap:10px;align-items:center"><label>Minutes:</label><input type="number" id="durationInput" min="1" max="30" value="2" inputmode="numeric"/><button id="saveDurationBtn">Save</button></div><div class="time-msg" id="adminTimeMsg">✨ Standard journey (2 min)</div></div>
<div class="card"><h3>🎮 Game Control</h3><button id="startGameBtn" style="width:100%;padding:14px;font-size:18px">START GAME FOR ALL → 3-2-1-START!</button><p id="gameStatus" style="margin-top:10px"></p><div style="margin-top:10px;display:flex;gap:10px"><button id="resetBtn" style="background:rgba(255,255,255,.1);color:white">Reset Room</button> <button id="viewPlayerBtn" style="background:rgba(255,255,255,.1);color:white">Refresh Players</button></div></div>
<div class="card"><h3>👥 Players <span id="playerCount" style="background:rgba(255,233,168,.2);padding:2px 8px;border-radius:999px">0</span></h3><div id="playerList"></div><p style="margin-top:12px">Timer Sync: <span id="syncTimer" style="font-family:monospace;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:8px">--:--</span></p></div>
<div class="card"><h3>🏆 Winners</h3><div id="winnerAdminList"></div></div>
<script>
let currentRoom=localStorage.getItem('forestType_lastAdminRoom')||"FOREST123";document.getElementById('roomInput').value=currentRoom;
function getTimeMessage(m){m=parseInt(m)||0;if(m<=1)return "⚡ Quick Dash - Fast!";if(m<=2)return "🌲 Short trail";if(m<=3)return "✨ Standard journey - Boo believes!";if(m<=5)return "🌙 Long forest walk";return "🌟 Epic quest";}
function updateAdminMsg(){const d=document.getElementById('durationInput').value;const el=document.getElementById('adminTimeMsg');if(!d||isNaN(d)||d<1||d>30){el.textContent="❌ Invalid - Enter 1-30";el.style.background="rgba(255,100,100,.15)";}else{el.textContent=getTimeMessage(d)+` (${d} min)`;el.style.background="rgba(125,211,200,.15)";}if(currentRoom&&d>=1&&d<=30){localStorage.setItem('forestType_duration_'+currentRoom,d);localStorage.setItem('forestType_duration',d);}}
document.getElementById('durationInput').addEventListener('input',updateAdminMsg);document.getElementById('durationInput').addEventListener('change',updateAdminMsg);
document.getElementById('createRoomBtn').onclick=()=>{const r=document.getElementById('roomInput').value.trim().toUpperCase();if(!r)return alert("Enter room code");currentRoom=r;localStorage.setItem('forestType_lastAdminRoom',r);localStorage.setItem('forestType_players_'+r,JSON.stringify([]));localStorage.setItem('forestType_winners_'+r,JSON.stringify([]));localStorage.removeItem('forestType_start_'+r);localStorage.removeItem('forestType_timer_'+r);localStorage.setItem('forestType_duration_'+r,document.getElementById('durationInput').value||2);document.getElementById('roomStatus').textContent=`✅ Room ${r} created! Share code ${r} with players`;refreshPlayers();};
document.getElementById('saveDurationBtn').onclick=()=>{updateAdminMsg();document.getElementById('roomStatus').textContent=`⏱️ Saved: ${document.getElementById('durationInput').value} min for room ${currentRoom}`;};
document.getElementById('startGameBtn').onclick=()=>{if(!currentRoom)return alert("Create room first");const d=parseInt(document.getElementById('durationInput').value);if(!d||isNaN(d)||d<1||d>30)return alert("❌ Fix timer: Enter 1-30");localStorage.setItem('forestType_duration_'+currentRoom,d.toString());localStorage.setItem('forestType_duration',d.toString());localStorage.setItem('forestType_start_'+currentRoom,JSON.stringify({duration:d,startedAt:Date.now()}));document.getElementById('gameStatus').textContent=`🚀 Game started! ${d} min - Countdown 3-2-1-START running on all players`;let s=d*60;const el=document.getElementById('syncTimer');if(window.adminInterval)clearInterval(window.adminInterval);window.adminInterval=setInterval(()=>{s--;const m=Math.floor(s/60),sec=s%60;el.textContent=`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;if(s<=0){clearInterval(window.adminInterval);el.textContent="00:00 - Game Ended";loadWinners();}},1000);};
function refreshPlayers(){if(!currentRoom)return;const ps=JSON.parse(localStorage.getItem('forestType_players_'+currentRoom)||"[]");document.getElementById('playerCount').textContent=ps.length;document.getElementById('playerList').innerHTML=ps.map(n=>`<div style="padding:8px;background:rgba(255,255,255,.05);margin:6px 0;border-radius:8px;display:flex;justify-content:space-between"><span>${n}</span><span style="background:rgba(255,233,168,.2);padding:2px 8px;border-radius:999px">${localStorage.getItem('forestType_score_'+currentRoom+'_'+n)||0} pts</span></div>`).join('')||"<p style='opacity:.6'>No players yet</p>";loadWinners();const t=localStorage.getItem('forestType_timer_'+currentRoom);if(t){const m=Math.floor(t/60),s=t%60;document.getElementById('syncTimer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}}
function loadWinners(){const w=JSON.parse(localStorage.getItem('forestType_winners_'+currentRoom)||"[]");const el=document.getElementById('winnerAdminList');el.innerHTML=w.length?w.map((p,i)=>{const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'👻';return `<div style="padding:8px;background:rgba(255,255,255,.05);margin:6px 0;border-radius:8px">${medal} ${p.name} - ${p.score} pts</div>`;}).join(''):"<p style='opacity:.6'>No winners yet - game not finished</p>";}
document.getElementById('viewPlayerBtn').onclick=refreshPlayers;document.getElementById('resetBtn').onclick=()=>{if(!confirm(`Reset room ${currentRoom}? Clears players`))return;localStorage.setItem('forestType_players_'+currentRoom,JSON.stringify([]));localStorage.removeItem('forestType_start_'+currentRoom);localStorage.removeItem('forestType_timer_'+currentRoom);localStorage.setItem('forestType_winners_'+currentRoom,JSON.stringify([]));refreshPlayers();document.getElementById('gameStatus').textContent="🔄 Room reset";if(window.adminInterval)clearInterval(window.adminInterval);};
updateAdminMsg();refreshPlayers();setInterval(refreshPlayers,2000);
</script></body></html>
